<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE DN - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; overflow: hidden; }
        
        /* Top Navigation Tabs */
        .admin-nav { display: flex; background: #1e293b; padding: 10px 20px; gap: 15px; border-bottom: 1px solid #334155; height: 50px; box-sizing: border-box; align-items: center; }
        .tab-btn { padding: 8px 20px; border: none; cursor: pointer; background: #334155; color: #cbd5e1; border-radius: 6px; font-weight: bold; font-size: 0.95rem; transition: all 0.2s; }
        .tab-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        
        /* Shop Status Toggle Button (Sticks to the right) */
        .shop-status-btn { 
            padding: 8px 18px; 
            border: none; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.95rem; 
            transition: all 0.2s; 
            margin-left: auto; 
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .shop-status-btn.open { background: #22c55e; color: white; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); }
        .shop-status-btn.closed { background: #ef4444; color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }

        /* Content Areas */
        .content-area { width: 100%; height: calc(100vh - 50px); }
        .tab-content { display: none; width: 100%; height: 100%; }
        .tab-content.active { display: block; }
        
        /* Iframe for Kitchen, Cashier, and Products */
        .panel-iframe { width: 100%; height: 100%; border: none; background: #0f172a; }

        /* 🔒 Admin Login Overlay Styles */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        .login-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .login-card h2 { color: #f8fafc; margin-bottom: 8px; }
        .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .login-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .login-input:focus { border-color: #3b82f6; outline: none; }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover { background: #2563eb; }
    </style>
</head>
<body>

    <!-- 🔒 Admin Login Overlay (මුලින්ම මතුවන Login Form එක) -->
    <div id="loginOverlay" style="display: none;">
        <div class="login-card">
            <h2>🔒 CAFE DN Admin</h2>
            <p>ප්‍රවේශ වීමට ඔබගේ විස්තර ඇතුළත් කරන්න</p>
            
            <form id="loginForm" onsubmit="handleAdminLogin(event)">
                <input type="text" id="adminUser" class="login-input" placeholder="Username" required>
                <input type="password" id="adminPass" class="login-input" placeholder="Password" required>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <p id="loginError" style="color: #ef4444; font-size: 13px; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- Tab Navigation -->
    <div class="admin-nav">
        <button class="tab-btn active" onclick="openTab('kitchen-tab', this)">🍳 Kitchen Display</button>
        <button class="tab-btn" onclick="openTab('cashier-tab', this)">💰 Cashier System</button>
        <button class="tab-btn" onclick="openTab('products-tab', this)">🍔 Product Management</button>
        <button class="tab-btn" onclick="openTab('categories-tab', this)">🗃️ Category Management</button>
        <button class="tab-btn" onclick="openTab('qr-generator-tab', this)">⛶ QR Code Generator</button>
        <button class="tab-btn" onclick="openTab('reports-tab', this)">📊 Reports</button>
        
        <!-- Shop Open/Close Button -->
        <button id="shopStatusBtn" class="shop-status-btn open" onclick="toggleShopStatus()">
            <span id="shopStatusDot">🟢</span> <span id="shopStatusText">Shop Open</span>
        </button>

        <!-- Logout Button -->
        <button class="tab-btn" onclick="adminLogout()" style="background: #ef4444; color: white; display: flex; align-items: center; gap: 5px;">
            🚪 Logout
        </button>
    </div>

    <!-- Content Sections -->
    <div class="content-area">
        <!-- Kitchen Tab -->
        <div id="kitchen-tab" class="tab-content active">
            <iframe src="kitchen.html" class="panel-iframe"></iframe>
        </div>

        <!-- Cashier Tab -->
        <div id="cashier-tab" class="tab-content">
            <iframe src="cashier.html" class="panel-iframe"></iframe>
        </div>

        <!-- Products Tab -->
        <div id="products-tab" class="tab-content">
            <iframe src="product-manage.html" class="panel-iframe"></iframe>
        </div>

        <!-- Categories Tab -->
        <div id="categories-tab" class="tab-content">
            <iframe src="category_manage.html" class="panel-iframe"></iframe>   
        </div>

        <!-- QR Code Generator Tab -->
        <div id="qr-generator-tab" class="tab-content">
            <iframe src="qr-generator.html" class="panel-iframe"></iframe>
        </div>

        <!-- Reports Tab -->
        <div id="reports-tab" class="tab-content">
            <iframe src="reports.html" class="panel-iframe"></iframe>
        </div>
    </div>

    <!-- Script for Tab Navigation, Login, Shop Status, and Logout -->
    <script>
        // පිටුව ලෝඩ් වූ වහාම ලොග් වී ඇත්දැයි පරීක්ෂා කිරීම
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isAdminLoggedIn');
            const overlay = document.getElementById('loginOverlay');
            
            if (isLoggedIn !== 'true') {
                if (overlay) overlay.style.display = 'flex';
            } else {
                if (overlay) overlay.style.display = 'none';
            }
            fetchShopStatus();
        });

        // Admin Login වීම පරීක්ෂා කිරීම සහ සර්වර් එකට යැවීම
        async function handleAdminLogin(event) {
            event.preventDefault();
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;
            const errorMsg = document.getElementById('loginError');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    const overlay = document.getElementById('loginOverlay');
                    if (overlay) overlay.style.display = 'none';
                    // Clear inputs
                    document.getElementById('adminUser').value = '';
                    document.getElementById('adminPass').value = '';
                    if (errorMsg) errorMsg.innerText = '';
                } else {
                    if (errorMsg) errorMsg.innerText = data.message || 'වැරදි Username එකක් හෝ Password එකක්!';
                }
            } catch (err) {
                if (errorMsg) errorMsg.innerText = 'සර්වර් එක සමඟ සම්බන්ධ වීමේ දෝෂයක්!';
            }
        }

        // Admin Logout Function
        function adminLogout() {
            if (confirm('ඔබට ඇඩ්මින් පැනල් එකෙන් ඉවත් වීමට (Logout වීමට) අවශ්‍ය බව විශ්වාසද?')) {
                localStorage.removeItem('isAdminLoggedIn');
                const overlay = document.getElementById('loginOverlay');
                if (overlay) {
                    overlay.style.display = 'flex';
                }
            }
        }

        // Tab switching function
        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.admin-nav .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Fetch current shop status on load
        async function fetchShopStatus() {
            try {
                const response = await fetch('/api/shop-status');
                const data = await response.json();
                updateShopStatusUI(data.isOpen);
            } catch (error) {
                console.error('Error fetching shop status:', error);
            }
        }

        // Toggle shop status (Open / Closed)
        async function toggleShopStatus() {
            const btn = document.getElementById('shopStatusBtn');
            const isOpen = btn.classList.contains('open');
            const newStatus = !isOpen; // Switch state

            try {
                const response = await fetch('/api/shop-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isOpen: newStatus })
                });
                const data = await response.json();
                updateShopStatusUI(data.isOpen);
            } catch (error) {
                console.error('Error updating shop status:', error);
            }
        }

        // Update UI based on status
        function updateShopStatusUI(isOpen) {
            const btn = document.getElementById('shopStatusBtn');
            const dot = document.getElementById('shopStatusDot');
            const text = document.getElementById('shopStatusText');

            if (isOpen) {
                btn.className = 'shop-status-btn open';
                dot.textContent = '🟢';
                text.textContent = 'Shop Open';
            } else {
                btn.className = 'shop-status-btn closed';
                dot.textContent = '🔴';
                text.textContent = 'Shop Closed';
            }
        }
    </script>
    <script src="admin.js"></script>
</body>
</html>
