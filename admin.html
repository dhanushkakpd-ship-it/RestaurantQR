<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE DN - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; overflow: hidden; }
        
        /* Top Navigation Tabs */
        .admin-nav { display: flex; background: #1e293b; padding: 10px 20px; gap: 15px; border-bottom: 1px solid #334155; height: 50px; box-sizing: border-box; align-items: center; }
        .tab-btn { padding: 8px 20px; border: none; cursor: pointer; background: #334155; color: #cbd5e1; border-radius: 6px; font-weight: bold; font-size: 0.95rem; transition: all 0.2s; }
        .tab-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        
        /* Content Areas */
        .content-area { width: 100%; height: calc(100vh - 50px); }
        .tab-content { display: none; width: 100%; height: 100%; }
        .tab-content.active { display: block; }
        
        /* Iframe for Kitchen, Cashier, and Products */
        .panel-iframe { width: 100%; height: 100%; border: none; background: #0f172a; }
    </style>
</head>
<body>

    <!-- Tab Navigation -->
    <div class="admin-nav">
        <button class="tab-btn active" onclick="openTab('kitchen-tab', this)">🍳 Kitchen Display</button>
        <button class="tab-btn" onclick="openTab('cashier-tab', this)">💰 Cashier System</button>
        <button class="tab-btn" onclick="openTab('products-tab', this)">🍔 Product Management</button>
        <button class="tab-btn" onclick="openTab('categories-tab', this)">🗃️ Category Management</button>
        <button class="tab-btn" onclick="openTab('qr-generator-tab', this)">⛶ QR Code Generator</button>
    </div>

    <!-- Content Sections -->
    <div class="content-area">
        <!-- Kitchen Tab: Loads kitchen.html inside iframe -->
        <div id="kitchen-tab" class="tab-content active">
            <iframe src="kitchen.html" class="panel-iframe"></iframe>
        </div>

        <!-- Cashier Tab: Loads cashier.html inside iframe -->
        <div id="cashier-tab" class="tab-content">
            <iframe src="cashier.html" class="panel-iframe"></iframe>
        </div>

        <!-- Products Tab: Loads product-manage.html inside iframe -->
        <div id="products-tab" class="tab-content">
            <iframe src="product-manage.html" class="panel-iframe"></iframe>
        </div>

        <!-- Categories Tab: Loads category-manage.html inside iframe -->
        <div id="categories-tab" class="tab-content">
            <iframe src="category_manage.html" class="panel-iframe"></iframe>   
        </div>

        <!-- QR Code Generator Tab: Loads qr-generator.html inside iframe -->
        <div id="qr-generator-tab" class="tab-content">
            <iframe src="qr-generator.html" class="panel-iframe"></iframe>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
