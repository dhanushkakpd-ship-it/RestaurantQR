<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE DN - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; overflow: hidden; }
        
        /* Top Navigation Tabs */
        .admin-nav { display: flex; background: #1e293b; padding: 10px 20px; gap: 15px; border-bottom: 1px solid #334155; height: 50px; box-sizing: border-box; align-items: center; }
        .tab-btn { padding: 8px 20px; border: none; cursor: pointer; background: #334155; color: #cbd5e1; border-radius: 6px; font-weight: bold; font-size: 0.95rem; transition: all 0.2s; }
        .tab-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        
        /* Shop Status Toggle Button (Sticks to the right) */
        .shop-status-btn { 
            padding: 8px 18px; 
            border: none; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.95rem; 
            transition: all 0.2s; 
            margin-left: auto; 
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .shop-status-btn.open { background: #22c55e; color: white; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); }
        .shop-status-btn.closed { background: #ef4444; color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }

        /* Content Areas */
        .content-area { width: 100%; height: calc(100vh - 50px); }
        .tab-content { display: none; width: 100%; height: 100%; }
        .tab-content.active { display: block; }
        
        /* Iframe for Kitchen, Cashier, and Products */
        .panel-iframe { width: 100%; height: 100%; border: none; background: #0f172a; }
    </style>
</head>
<body>

    <!-- Tab Navigation -->
    <div class="admin-nav">
        <button class="tab-btn active" onclick="openTab('kitchen-tab', this)">🍳 Kitchen Display</button>
        <button class="tab-btn" onclick="openTab('cashier-tab', this)">💰 Cashier System</button>
        <button class="tab-btn" onclick="openTab('products-tab', this)">🍔 Product Management</button>
        <button class="tab-btn" onclick="openTab('categories-tab', this)">🗃️ Category Management</button>
        <button class="tab-btn" onclick="openTab('qr-generator-tab', this)">⛶ QR Code Generator</button>
        
        <!-- Shop Open/Close Button -->
        <button id="shopStatusBtn" class="shop-status-btn open" onclick="toggleShopStatus()">
            <span id="shopStatusDot">🟢</span> <span id="shopStatusText">Shop Open</span>
        </button>
    </div>

    <!-- Content Sections -->
    <div class="content-area">
        <!-- Kitchen Tab -->
        <div id="kitchen-tab" class="tab-content active">
            <iframe src="kitchen.html" class="panel-iframe"></iframe>
        </div>

        <!-- Cashier Tab -->
        <div id="cashier-tab" class="tab-content">
            <iframe src="cashier.html" class="panel-iframe"></iframe>
        </div>

        <!-- Products Tab -->
        <div id="products-tab" class="tab-content">
            <iframe src="product-manage.html" class="panel-iframe"></iframe>
        </div>

        <!-- Categories Tab -->
        <div id="categories-tab" class="tab-content">
            <iframe src="category_manage.html" class="panel-iframe"></iframe>   
        </div>

        <!-- QR Code Generator Tab -->
        <div id="qr-generator-tab" class="tab-content">
            <iframe src="qr-generator.html" class="panel-iframe"></iframe>
        </div>
    </div>

    <!-- Script for Tab Navigation and Shop Status -->
    <script>
        // Tab switching function
        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.admin-nav .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Fetch current shop status on load
        async function fetchShopStatus() {
            try {
                const response = await fetch('/api/shop-status');
                const data = await response.json();
                updateShopStatusUI(data.isOpen);
            } catch (error) {
                console.error('Error fetching shop status:', error);
            }
        }

        // Toggle shop status (Open / Closed)
        async function toggleShopStatus() {
            const btn = document.getElementById('shopStatusBtn');
            const isOpen = btn.classList.contains('open');
            const newStatus = !isOpen; // Switch state

            try {
                const response = await fetch('/api/shop-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isOpen: newStatus })
                });
                const data = await response.json();
                updateShopStatusUI(data.isOpen);
            } catch (error) {
                console.error('Error updating shop status:', error);
            }
        }

        // Update UI based on status
        function updateShopStatusUI(isOpen) {
            const btn = document.getElementById('shopStatusBtn');
            const dot = document.getElementById('shopStatusDot');
            const text = document.getElementById('shopStatusText');

            if (isOpen) {
                btn.className = 'shop-status-btn open';
                dot.textContent = '🟢';
                text.textContent = 'Shop Open';
            } else {
                btn.className = 'shop-status-btn closed';
                dot.textContent = '🔴';
                text.textContent = 'Shop Closed';
            }
        }

        // Load status when page opens
        window.onload = fetchShopStatus;
    </script>
    <script src="admin.js"></script>
</body>
</html>
