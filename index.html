<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE DN - Quick Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Simple Logo Loading Screen -->
    <div id="app-loader">
        <div class="loader-content">
            <img src="https://res.cloudinary.com/euc8lhe4/image/upload/v1788022665/logo.png" alt="CAFE DN Logo" class="loader-logo">
            <h2 class="loader-title">CAFE DN</h2>
            <div class="loader-spinner"></div>
        </div>
    </div>

    <!-- Header Section -->
    <header class="header">
        <div class="brand">
            <div class="logo">
                <img src="https://res.cloudinary.com/euc8lhe4/image/upload/v1788022665/logo.png" alt="CAFE DN Logo">
            </div>
            <div>
                <h1>CAFE DN</h1>
                <div class="status-badges">
                    <span class="badge-table">📍 Table 04</span>
                    <span class="badge-status">🟢 Open Now</span>
                </div>

                <!-- Hotline -->
                <div style="margin-top: 6px; font-size: 0.85rem; color: #475569;">
                    📞 Hotline: <a href="tel:0754940329" id="shop-phone-display" style="color: #2563eb; font-weight: bold; text-decoration: none;">075 494 0329</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Order Type Selector -->
    <div class="order-type-tabs" id="order-type-tabs">
        <button class="tab-btn active" onclick="setOrderType('dinein')">♨ Dine-in</button>
        <button class="tab-btn" onclick="setOrderType('takeaway')">🛍️ Takeaway</button>
    </div>

    <!-- 🌟 1. මෙනුවට ඉහළින් (Category tabs වලට උඩින්) Live Order Tracker එක මෙහි තබා ඇත -->
    <div id="live-order-tracker" style="display: none; margin: 7px auto; width: 95%; max-width: 600px;"></div>

    <!-- Categories Tabs Container -->
    <div id="categoryTabs" class="category-tabs">
        <!-- දත්ත සර්වර් එකෙන් මෙතැනට Load වේ -->
    </div>

    <!-- Product List Container -->
    <main class="menu-container">
        <div id="product-list" class="product-grid">
            <!-- Products will be dynamically loaded from app.js -->
        </div>
    </main>

    <!-- Floating Bottom Cart Bar -->
    <div id="cart-bar" class="cart-bar" style="display: none;">
        <div class="cart-summary" onclick="toggleCart()">
            <div class="cart-left">
                🛒 View Order (<span id="cart-count">0</span>)
            </div>
            <div class="cart-right">
                <span id="cart-total-price">Rs. 0.00</span> ▲
            </div>
        </div>

        <!-- Cart Dropdown Details -->
        <div id="cart-details" class="cart-details" style="display: none;">
            <h3>🛒 Your Selected Items</h3>
            <div id="cart-items-container" class="cart-items-list"></div>

            <!-- 🌟 Order Type Display Box Added Here -->
            <div style="background: #fdf2f8; padding: 8px 12px; border-radius: 8px; margin: 10px 0; border: 1px solid #fce7f3; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
                <span style="color: #475569; font-weight: 600;">🍽️ Order Type:</span>
                <span id="selected-order-type-display" style="color: #db2777; font-weight: 700; background: #fff; padding: 3px 10px; border-radius: 6px; border: 1px solid #fce7f3;">Dine-in</span>
            </div>

            <div class="cart-input-group">
                <label for="cust-name">👤 Customer Name (ඔබගේ නම):</label>
                <input type="text" id="cust-name" placeholder="e.g. Kamal Perera">

                <label for="cust-phone" style="margin-top: 8px;">📱 Phone / WhatsApp Number (Optional):</label>
                <input type="tel" id="cust-phone" placeholder="e.g. 0771234567">
            </div>

            <!-- Pick-up Time Input -->
            <div class="cart-input-group" id="pickup-time-container">
                <label for="cust-time">🕒 Pick-up Time (රැගෙන යන වෙලාව):</label>
                <input type="time" id="cust-time">
            </div>

            <button class="checkout-btn" onclick="openOrderModal()">📋 Review Order & Proceed</button>
        </div>
    </div>

    <!-- 🌟 Order Summary Popup Modal 🌟 -->
    <div id="order-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🧾 Order Review</h3>
                <span class="close-modal" onclick="closeOrderModal()">&times;</span>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- Summary details will appear here -->
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-confirm" onclick="submitOrder(false)">
                    ✅ Confirm Order Only
                </button>
                <button class="btn-modal btn-wa" onclick="submitOrder(true)">
                    📲 Confirm & Send via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- App JS Link -->
    <script src="app.js"></script>

    <!-- 🌟 Order Status & Tab Visibility Helper Script 🌟 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const timeContainer = document.getElementById('pickup-time-container');
            
            function updateVisibility() {
                if (!timeContainer) return;
                if (typeof isTableQR !== 'undefined' && isTableQR) {
                    timeContainer.style.display = 'none';
                    return;
                }
                const activeTab = document.querySelector('.tab-btn.active');
                if (activeTab && activeTab.textContent.includes('Takeaway')) {
                    timeContainer.style.display = 'block';
                } else {
                    timeContainer.style.display = 'none';
                }
            }

            document.addEventListener('click', (e) => {
                if (e.target.closest('.tab-btn')) {
                    setTimeout(updateVisibility, 50);
                }
            });

            setTimeout(updateVisibility, 200);

            setTimeout(() => {
                if (typeof window.openOrderModal === 'function') {
                    const originalOpenOrderModal = window.openOrderModal;
                    window.openOrderModal = function() {
                        originalOpenOrderModal(); 
                        
                        setTimeout(() => {
                            const modalBody = document.getElementById('modal-body');
                            const timeInput = document.getElementById('cust-time');
                            
                            if (modalBody && timeInput && timeContainer && timeContainer.style.display !== 'none') {
                                const timeVal = timeInput.value ? timeInput.value : 'ASAP';
                                if (!modalBody.innerHTML.includes('Pick-up Time')) {
                                    modalBody.innerHTML += `<div style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ccc;">🕒 <b>Pick-up Time:</b> ${timeVal}</div>`;
                                }
                            }
                        }, 50);
                    };
                }
            }, 300);
        });
    </script>
</body>
</html>
